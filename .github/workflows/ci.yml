name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      # KalkanCrypt (libkalkancryptwr-64.so) - закрытый нативный SDK от
      # pki.gov.kz, распространять его публично нельзя (см. AGENTS.md). CI
      # тянет уже подготовленную копию по приватному URL - секрет
      # замаскирован в логах через add-mask, сама переменная нигде, кроме
      # памяти шага, не сохраняется.
      - name: Install KalkanCrypt native library
        env:
          KALKAN_SO_URL: ${{ secrets.KALKAN_SO_URL }}
        run: |
          echo "::add-mask::$KALKAN_SO_URL"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite1 libltdl7 zlib1g
          curl -sSfL -o /tmp/libkalkancryptwr-64.so "$KALKAN_SO_URL"
          sudo mv /tmp/libkalkancryptwr-64.so /usr/lib/libkalkancryptwr-64.so
          sudo ldconfig
      # KalkanCrypt подтверждает валидность цепочки не только через сертификаты,
      # переданные в WithCerts, но и опирается на системное доверенное
      # хранилище - без этого шага X509LoadCertificateFromFile для тестовых
      # GOST-2022 root/intermediate падает с "certificate expired or not yet
      # valid" (0x8f00042), хотя сами сертификаты валидны до 2032 года.
      # Эмпирически подтверждено - см. gokalkan wtest.Dockerfile.
      - name: Install test CA certs system-wide
        run: |
          openssl x509 -inform DER -in internal/testdata/certs/root_test_gost_2022.cer -out /tmp/root_test_gost_2022.crt
          openssl x509 -inform DER -in internal/testdata/certs/nca_gost2022_test.cer -out /tmp/nca_gost2022_test.crt
          sudo cp /tmp/root_test_gost_2022.crt /tmp/nca_gost2022_test.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates
      - name: Test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
