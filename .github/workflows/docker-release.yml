name: Create Docker Release

# Триггерится тем же тегом, что и release.yml, а не событием "release:
# published" - релиз в release.yml создаётся от имени GITHUB_TOKEN, а такие
# события GitHub Actions намеренно не ретранслирует в другие workflow (защита
# от рекурсии), так что "release: published" здесь никогда не сработал бы
# автоматически без ручного клика "Publish" в UI.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Только linux/amd64 - libkalkancryptwr-64.so собрана KalkanCrypt
      # исключительно под x86_64 и на ARM в принципе не загрузится
      # (см. AGENTS.md), поэтому multi-arch образ здесь, в отличие от
      # Java-версии, не имеет смысла.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}
          secrets: |
            kalkan_so_url=${{ secrets.KALKAN_SO_URL }}
